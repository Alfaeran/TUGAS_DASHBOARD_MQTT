# =============================================================
# Eclipse Mosquitto Configuration
# MQTT Smart Campus Facility Management
# =============================================================

# ---- General Settings ----
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

# ---- Default MQTT Listener (TCP) ----
listener 1883
protocol mqtt
allow_anonymous true

# ---- WebSocket Listener ----
listener 9001
protocol websockets
allow_anonymous true
